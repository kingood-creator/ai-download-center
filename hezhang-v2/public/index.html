<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>合账 v2.0</title><link rel="stylesheet" href="/app.css"></head>
<body><main id="auth" class="shell auth"><div class="brand"><span>H</span><div><h1>合账</h1><p>团队账目，清楚有据</p></div></div><section class="card"><div class="tabs"><button class="tab active" data-auth="login">登录</button><button class="tab" data-auth="bootstrap">首次初始化</button></div><form id="loginForm"><label>邮箱<input name="email" type="email" autocomplete="email" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><form id="bootstrapForm" hidden><p class="hint">仅限尚未建立账号的新团队，需由部署者提供初始化令牌。</p><label>姓名<input name="name" maxlength="80" required></label><label>邮箱<input name="email" type="email" required></label><label>密码<input name="password" type="password" minlength="10" required></label><label>初始化令牌<input name="bootstrapToken" type="password" required></label><button>创建管理员并进入系统</button></form></section></main>
<main id="app" class="shell" hidden><header><div class="brand mini"><span>H</span><h1>合账 <em>v2.0</em></h1></div><button class="ghost" id="logout">退出</button></header>
<section id="page-entry" class="page"><div class="eyebrow">快速记账</div><form id="expenseForm" class="card compact"><label>采购物品<input id="item" required maxlength="160" placeholder="买了什么？"></label><div class="two"><label>金额（元）<input id="amount" inputmode="decimal" type="number" min="0.01" step="0.01" required placeholder="¥ 0.00"></label><label>报账成员<select id="payer" required></select></label></div><div class="two"><label>支出分类<input id="category" value="日常采购" maxlength="60" required></label><label>采购日期<input id="occurredOn" type="date" required></label></div><div class="segmented"><button type="button" data-kind="reimbursement" class="selected">统一报销</button><button type="button" data-kind="aa">AA 分摊</button></div><div id="aaRow" class="member-picker" hidden><span>AA 成员</span><div id="participantOptions"></div></div><details><summary>备注与凭证（选填）</summary><textarea id="note" maxlength="1000" placeholder="购买地点、原因等"></textarea><label class="upload">添加照片凭证 <input id="vouchers" type="file" accept="image/jpeg,image/png,image/webp,image/heic" multiple></label><div id="preview" class="previews"></div></details><button class="save">保存记账</button></form></section>
<section id="page-ledger" class="page" hidden><div class="page-title"><div><div class="eyebrow">团队账目</div><h2>账目流水</h2></div><a class="button secondary" id="csvExport">导出 CSV</a></div><div class="filter card"><input id="from" type="date" aria-label="开始日期"><span>至</span><input id="to" type="date" aria-label="结束日期"><button id="applyFilter" type="button" class="secondary">筛选</button></div><div id="ledgerList" class="list"></div></section>
<section id="page-stats" class="page" hidden><div class="eyebrow">透明汇总</div><h2>统计报表</h2><div class="stat-grid"><article class="card"><span>有效支出</span><strong id="net">¥0.00</strong></article><article class="card"><span>冲红金额</span><strong class="negative" id="reversed">¥0.00</strong></article></div><section class="card"><h3>按分类</h3><div id="categoryStats"></div></section></section>
<section id="page-approvals" class="page" hidden><div class="eyebrow">管理员与审计员</div><h2>待审批冲红</h2><div id="reversalList" class="list"></div></section>
<section id="page-members" class="page" hidden><div class="page-title"><div><div class="eyebrow">账户与权限</div><h2>成员管理</h2></div><button class="secondary" id="showMember">添加成员</button></div><div id="memberList" class="list"></div></section>
<nav><button data-page="entry" class="active">记账</button><button data-page="ledger">流水</button><button data-page="stats">统计</button><button data-page="approvals" class="privileged">审批</button><button data-page="members" class="admin-only">成员</button></nav></main>
<dialog id="detailDialog"><button class="close" data-close>×</button><div id="detailContent"></div></dialog><dialog id="memberDialog"><button class="close" data-close>×</button><h2>添加成员</h2><form id="memberForm"><label>姓名<input name="name" required maxlength="80"></label><label>邮箱<input name="email" type="email" required></label><label>初始密码<input name="password" type="password" minlength="10" required></label><label>权限<select name="role"><option value="member">成员：记账、评论、申请冲红</option><option value="auditor">审计员：查看、处理异议和审批</option><option value="admin">管理员：全权管理</option></select></label><button>创建账号</button></form></dialog><div id="toast" role="status"></div><script src="/app.js"></script></body></html>
