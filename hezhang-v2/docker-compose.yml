services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://hezhang:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/hezhang
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?set BOOTSTRAP_TOKEN}
      MAX_UPLOAD_MB: 10
    volumes:
      - vouchers:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hezhang
      POSTGRES_USER: hezhang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hezhang -d hezhang"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  postgres_data:
  vouchers:
