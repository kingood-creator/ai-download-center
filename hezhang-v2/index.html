<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>合账 v2.0 · 本地体验版</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#182331;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:560px;margin:auto;padding:16px 16px 90px}h1{font-size:23px;margin:12px 0 6px}h2{font-size:17px;margin:0 0 12px}.muted{color:#778293;font-size:12px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #15263b09}input,select,button,textarea{font:inherit}input,select,textarea{width:100%;padding:12px;border:1px solid #dce2ea;border-radius:11px;background:white;margin:6px 0}button{border:0;border-radius:11px;padding:12px 14px;background:#1769e0;color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.45}.secondary{background:#eef3fa;color:#1d477a}.danger{background:#fff0f0;color:#bc3131}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}.tabs{display:flex;gap:8px}.tabs button{flex:1}.active{background:#1769e0;color:white}.item{border-top:1px solid #e8edf2;padding:13px 0}.item:first-child{border:0}.money{font-weight:750;font-size:20px;white-space:nowrap}.red{color:#c73434}.small{font-size:13px}.pill{display:inline-block;background:#edf3fc;border-radius:8px;padding:4px 7px;font-size:12px}.hidden{display:none}.photos{display:flex;gap:8px;flex-wrap:wrap}.photos img{width:65px;height:65px;object-fit:cover;border-radius:9px}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e8edf2;padding:9px max(12px,env(safe-area-inset-right));display:flex;justify-content:center;gap:10px}.bottom button{max-width:170px;flex:1}.notice{padding:9px;background:#fff8e8;border-radius:9px;color:#765b18;font-size:12px}label{font-size:13px;font-weight:600}.split{display:flex;justify-content:space-between;gap:8px;align-items:center}input[type=checkbox]{width:auto}
</style></head><body><div class="wrap"><h1>合账 <span class="muted">v2.0 本地体验版</span></h1><div class="notice">数据只保存在当前浏览器，未接入团队服务器、登录、审核及云端备份。请勿用于正式财务结算。</div>
<section id="entry" class="card"><h2>记一笔</h2><form id="expenseForm"><div class="row"><select id="category"><option>采购</option><option>日常</option><option>其他</option></select><select id="mode"><option value="reimburse">统一报销</option><option value="aa">AA 分摊</option></select></div><input id="item" required maxlength="100" placeholder="买了什么？" autocomplete="off"><div class="row"><input id="amount" type="number" min="0.01" step="0.01" required placeholder="¥ 金额"><input id="payer" required placeholder="垫付人" value="我"></div><div id="aaBox" class="hidden"><label>参与 AA 的成员（逗号分隔，包含垫付人）</label><input id="members" placeholder="我,张三,李四"><div id="aaHint" class="muted"></div></div><div class="row"><button type="button" class="secondary" id="cameraBtn">📷 拍照</button><button type="button" class="secondary" id="albumBtn">🖼 相册 / 截图</button></div><input id="camera" type="file" accept="image/*" capture="environment" hidden><input id="album" type="file" accept="image/*" multiple hidden><div id="preview" class="photos"></div><button style="width:100%;margin-top:10px" type="submit">提交记账</button></form></section>
<section id="ledger" class="card hidden"><div class="split"><h2>账目流水</h2><button class="secondary" id="exportBtn">导出 CSV</button></div><div id="ledgerList"></div></section>
<section id="report" class="card hidden"><h2>统计与对账</h2><div class="row"><input id="from" type="date" aria-label="开始日期"><input id="to" type="date" aria-label="结束日期"></div><select id="filter"><option value="all">全部结算方式</option><option value="reimburse">仅统一报销</option><option value="aa">仅 AA 分摊</option></select><div id="summary"></div><h2 style="margin-top:18px">每人净额</h2><div id="balances"></div></section></div>
<nav class="bottom"><button data-tab="entry">记账</button><button data-tab="ledger" class="secondary">流水</button><button data-tab="report" class="secondary">报表</button></nav>
<dialog id="reverseDialog" style="border:0;border-radius:18px;max-width:440px;width:90%;padding:20px"><form id="reverseForm"><h2>关联冲红</h2><div id="originInfo" class="small"></div><label>冲红金额（元）</label><input id="reverseAmount" type="number" min="0.01" step="0.01" required><label>冲红原因</label><textarea id="reason" required placeholder="退款、重复记账、录入错误"></textarea><div class="row"><button type="button" class="secondary" id="cancelReverse">取消</button><button type="submit" class="danger">确认冲红</button></div></form></dialog>
<script>
'use strict';
const KEY='hezhang_v2_local_records';let records=[];let images=[];let reverseTarget=null;
const $=id=>document.getElementById(id);const money=n=>(n/100).toFixed(2);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cents=s=>Math.round(Number(s)*100);const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');records=Array.isArray(raw)?raw:[]}catch(e){alert('本地数据读取失败，请先备份浏览器数据')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){alert('存储空间不足，未保存。请减少图片大小或导出数据。');return false}}
function remaining(id){const base=records.find(x=>x.id===id&&x.type==='expense');if(!base)return 0;return Math.max(0,base.amount+records.filter(x=>x.type==='reversal'&&x.originalId===id).reduce((s,x)=>s+x.amount,0))}
function allocations(r){if(r.mode==='reimburse')return {[r.payer]:r.amount};const people=[...new Set(r.members||[])];if(!people.length)return {};const sign=r.amount<0?-1:1;const abs=Math.abs(r.amount),q=Math.floor(abs/people.length),rem=abs%people.length;return Object.fromEntries(people.map((p,i)=>[p,sign*(q+(i<rem?1:0))]))}
function original(r){return r.type==='reversal'?records.find(x=>x.id===r.originalId):r}
function updateAA(){const aa=$('mode').value==='aa';$('aaBox').classList.toggle('hidden',!aa);const a=cents($('amount').value),members=$('members').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);$('aaHint').textContent=aa&&a>0&&members.length?'约每人 ¥'+money(Math.floor(a/members.length)):''}
$('mode').onchange=updateAA;$('amount').oninput=updateAA;$('members').oninput=updateAA;
$('cameraBtn').onclick=()=>$('camera').click();$('albumBtn').onclick=()=>$('album').click();
async function addImages(files){for(const f of [...files]){if(images.length>=9)break;if(!f.type.startsWith('image/'))continue;const img=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(f)});images.push(img)}$('preview').innerHTML=images.map((x,i)=>'<img alt="凭证'+(i+1)+'" src="'+x+'">').join('')}
$('camera').onchange=e=>addImages(e.target.files).catch(()=>alert('读取图片失败'));$('album').onchange=e=>addImages(e.target.files).catch(()=>alert('读取图片失败'));
$('expenseForm').onsubmit=e=>{e.preventDefault();const amount=cents($('amount').value),payer=$('payer').value.trim(),item=$('item').value.trim(),mode=$('mode').value,members=[...new Set($('members').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean))];if(!item||!payer||!Number.isSafeInteger(amount)||amount<=0)return alert('请正确填写内容和金额');if(mode==='aa'&&(!members.length||!members.includes(payer)))return alert('AA 成员必须包含垫付人');const r={id:uid(),type:'expense',category:$('category').value,item,amount,payer,mode,members:mode==='aa'?members:[],images:[...images],createdAt:new Date().toISOString()};records.push(r);if(!save()){records.pop();return}images=[];$('preview').innerHTML='';$('item').value='';$('amount').value='';$('camera').value='';$('album').value='';alert('记账成功');render()};
function openReverse(id){const r=records.find(x=>x.id===id&&x.type==='expense');if(!r)return;const max=remaining(id);if(!max)return alert('此账目已全部冲红');reverseTarget=id;$('originInfo').textContent=r.item+' · '+r.payer+' · 原账 '+r.id.slice(0,8)+' · 剩余 ¥'+money(max);$('reverseAmount').max=money(max);$('reverseAmount').value=money(max);$('reason').value='';$('reverseDialog').showModal()}
$('cancelReverse').onclick=()=>$('reverseDialog').close();
$('reverseForm').onsubmit=e=>{e.preventDefault();const base=records.find(x=>x.id===reverseTarget&&x.type==='expense');if(!base)return;const amount=cents($('reverseAmount').value),max=remaining(base.id),reason=$('reason').value.trim();if(!Number.isSafeInteger(amount)||amount<=0||amount>max||!reason)return alert('冲红金额必须大于0且不超过原账剩余金额，并填写原因');const r={id:uid(),type:'reversal',originalId:base.id,amount:-amount,reason,createdAt:new Date().toISOString()};records.push(r);if(!save()){records.pop();return}$('reverseDialog').close();render();alert('冲红记录已生成（本地体验版无管理员审核）')};
function effective(r){return r.type==='reversal'?{...original(r),...r,payer:original(r)?.payer||'',mode:original(r)?.mode||'reimburse',members:original(r)?.members||[],item:original(r)?.item||''}:r}
function renderLedger(){const list=[...records].reverse();$('ledgerList').innerHTML=list.length?list.map(r=>{const b=effective(r),rev=r.type==='reversal',left=rev?'':remaining(r.id);return '<div class="item"><div class="split"><b>'+esc(b.item)+'</b><span class="money '+(rev?'red':'')+'">'+(rev?'−':'+')+'¥'+money(Math.abs(r.amount))+'</span></div><div class="muted">'+esc(b.payer)+' · '+(b.mode==='aa'?'AA':'统一报销')+' · '+new Date(r.createdAt).toLocaleString()+'</div>'+(rev?'<div class="small red">冲红 · 原账 '+esc(r.originalId.slice(0,8))+' · '+esc(r.reason)+'</div>':'<div class="small">编号 '+esc(r.id.slice(0,8))+' · 剩余有效 ¥'+money(left)+'</div>')+(rev?'':'<div style="margin-top:8px"><button class="danger" data-reverse="'+esc(r.id)+'" '+(left===0?'disabled':'')+'>关联冲红</button></div>')+(r.images?.length?'<div class="photos">'+r.images.map(s=>'<img alt="凭证" src="'+s+'">').join('')+'</div>':'')+'</div>'}).join(''):'<p class="muted">暂无账目</p>';document.querySelectorAll('[data-reverse]').forEach(b=>b.onclick=()=>openReverse(b.dataset.reverse))}
function renderReport(){const from=$('from').value,to=$('to').value,filter=$('filter').value;const list=records.filter(r=>{const date=r.createdAt.slice(0,10),b=effective(r);return (!from||date>=from)&&(!to||date<=to)&&(filter==='all'||b.mode===filter)});const total=list.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0),reversed=list.filter(x=>x.type==='reversal').reduce((s,x)=>s+x.amount,0);$('summary').innerHTML='<div class="item">原始记账：<b>¥'+money(total)+'</b></div><div class="item">冲红金额：<b class="red">−¥'+money(-reversed)+'</b></div><div class="item">有效净额：<b>¥'+money(total+reversed)+'</b></div><p class="muted">日期按每条记录发生日筛选；跨期冲红可能影响当期净额。</p>';const balances={};for(const raw of list){const r=effective(raw),a=allocations(r);if(r.mode==='reimburse'){balances[r.payer]=(balances[r.payer]||0)+r.amount}else{for(const [p,share] of Object.entries(a))balances[p]=(balances[p]||0)-share;balances[r.payer]=(balances[r.payer]||0)+r.amount}}$('balances').innerHTML=Object.entries(balances).map(([p,n])=>'<div class="item split"><span>'+esc(p)+'</span><b class="'+(n<0?'red':'')+'">'+(n>=0?'应收 / 待报销 ':'应付 ')+'¥'+money(Math.abs(n))+'</b></div>').join('')||'<p class="muted">暂无数据</p>';$('balances').insertAdjacentHTML('beforeend','<p class="muted">统一报销余额与 AA 净额在此合并展示，仅用于体验；正式版应分别建立付款、报销和结算流水。</p>')}
function render(){renderLedger();renderReport()}$('from').onchange=renderReport;$('to').onchange=renderReport;$('filter').onchange=renderReport;
document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>{for(const id of ['entry','ledger','report'])$(id).classList.toggle('hidden',id!==btn.dataset.tab);document.querySelectorAll('[data-tab]').forEach(b=>b.className=b===btn?'':'secondary');render()});
$('exportBtn').onclick=()=>{const rows=[['编号','类型','关联原账','时间','分类','内容','垫付人','结算方式','金额(元)','原因'],...records.map(r=>{const b=effective(r);return [r.id,r.type,r.originalId||'',r.createdAt,b.category||'',b.item,b.payer,b.mode,money(r.amount),r.reason||'']})];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='合账流水.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></body></html>
